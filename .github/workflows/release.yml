name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for test build (no release, no brew bump)"
        default: "0.0.0-dev"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and bundle .app
        run: ./bundle.sh "${{ steps.ver.outputs.version }}" DisplayAlign.app

      - name: Install cargo-codesign
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          cargo install cargo-codesign

      - name: Import certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          source "$HOME/.cargo/env"
          cargo codesign macos --ci-import-cert

      - name: Add ephemeral keychain to search list
        # Workaround for cargo-codesign 0.2.x: --ci-import-cert creates the
        # keychain but does not add it to the user search list, so codesign
        # cannot find the identity. Drop once upstream ships the fix.
        run: |
          KC=$(cat target/.codesign-keychain)
          # shellcheck disable=SC2046  # word splitting is intentional here
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d ' "')
          security find-identity -v -p codesigning

      - name: Sign, notarize, and package
        id: sign
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          source "$HOME/.cargo/env"
          cargo codesign macos --app DisplayAlign.app

          DMG="DisplayAlign-v${{ steps.ver.outputs.version }}.dmg"
          mv DisplayAlign.dmg "$DMG"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "dmg=${DMG}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify signed DMG
        run: |
          source "$HOME/.cargo/env"
          cargo codesign verify "${{ steps.sign.outputs.dmg }}" --method macos

      - name: Cleanup certificate
        if: always()
        run: |
          source "$HOME/.cargo/env"
          cargo codesign macos --ci-cleanup-cert

      - name: Upload DMG artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: DisplayAlign-dmg
          path: ${{ steps.sign.outputs.dmg }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.sign.outputs.dmg }}
          generate_release_notes: true

  publish-homebrew-cask:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: "5422m4n-bot[bot]"
      GITHUB_EMAIL: "1178949+5422m4n-bot[bot]@users.noreply.github.com"
    steps:
      - name: Generate bot token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: sassman
          repositories: homebrew-tap

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: sassman/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}

      - name: Update cask formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          VERSION_NUM="${VERSION#v}"
          mkdir -p Casks

          cat > Casks/display-align.rb << EOF
          cask "display-align" do
            version "${VERSION_NUM}"
            sha256 "${SHA256}"

            url "https://github.com/sassman/display-align/releases/download/v#{version}/DisplayAlign-v#{version}.dmg"
            name "DisplayAlign"
            desc "Automatic display arrangement for macOS"
            homepage "https://github.com/sassman/display-align"

            depends_on macos: ">= :sonoma"

            app "DisplayAlign.app"

            zap trash: [
              "~/.config/display-align",
            ]
          end
          EOF

      - name: Commit and push
        run: |
          git config user.name "$GITHUB_USER"
          git config user.email "$GITHUB_EMAIL"
          git add Casks/display-align.rb
          git commit -m "chore(cask): update display-align to ${GITHUB_REF_NAME}"
          git push
