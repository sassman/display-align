name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: swift build -c release

      - name: Bundle .app
        run: |
          APP="DisplayAlign.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"

          cp .build/release/DisplayAlign "$APP/MacOS/"

          swift generate-icon.swift
          iconutil -c icns /tmp/DisplayAlign.iconset -o "$APP/Resources/AppIcon.icns"

          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$APP/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>me.d34dl0ck.display-align</string>
              <key>CFBundleName</key>
              <string>DisplayAlign</string>
              <key>CFBundleExecutable</key>
              <string>DisplayAlign</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>LSUIElement</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
          </dict>
          </plist>
          EOF

      - name: Install cargo-codesign
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          cargo install cargo-codesign

      - name: Import certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          source "$HOME/.cargo/env"
          cargo codesign macos --ci-import-cert

      - name: Sign, notarize, and package
        id: sign
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          source "$HOME/.cargo/env"
          cargo codesign macos --app DisplayAlign.app

          DMG="DisplayAlign-${{ github.ref_name }}.dmg"
          mv DisplayAlign.dmg "$DMG"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Cleanup certificate
        if: always()
        run: |
          source "$HOME/.cargo/env"
          cargo codesign macos --ci-cleanup-cert

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: DisplayAlign-${{ github.ref_name }}.dmg
          generate_release_notes: true

  publish-homebrew-cask:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: "5422m4n-bot[bot]"
      GITHUB_EMAIL: "1178949+5422m4n-bot[bot]@users.noreply.github.com"
    steps:
      - name: Generate bot token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: sassman
          repositories: homebrew-tap

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: sassman/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}

      - name: Update cask formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          VERSION_NUM="${VERSION#v}"
          mkdir -p Casks

          cat > Casks/display-align.rb << EOF
          cask "display-align" do
            version "${VERSION_NUM}"
            sha256 "${SHA256}"

            url "https://github.com/sassman/display-align/releases/download/v#{version}/DisplayAlign-v#{version}.dmg"
            name "DisplayAlign"
            desc "Automatic display arrangement for macOS"
            homepage "https://github.com/sassman/display-align"

            depends_on macos: ">= :sonoma"

            app "DisplayAlign.app"

            zap trash: [
              "~/.config/display-align",
            ]
          end
          EOF

      - name: Commit and push
        run: |
          git config user.name "$GITHUB_USER"
          git config user.email "$GITHUB_EMAIL"
          git add Casks/display-align.rb
          git commit -m "chore(cask): update display-align to ${GITHUB_REF_NAME}"
          git push
