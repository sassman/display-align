name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install swift-format
        run: brew install swift-format

      - name: Lint (swift-format)
        run: swift-format lint --strict --recursive Sources/ Tests/

      - name: Build
        run: swift build

      - name: Test
        run: swift test
